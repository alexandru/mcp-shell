[workspace]
members = ["main", "xtask"]
default-members = ["main"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
futures-util = "0.3.32"
nix = { version = "0.31.3", features = ["signal", "process"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
shlex = "2.0.1"
subtle = "2.6.1"
thiserror = "2.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
toml = "0.9.12"
tree-sitter = "=0.25.10"
tree-sitter-bash = "=0.25.1"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
