bind = "127.0.0.1:8090"
allowed_hosts = [
  "127.0.0.1:8090",
  "localhost:8090",
  "host.docker.internal:8090",
  "host.docker.internal:8443",
  "mcp.example.com",
]
allowed_origins = []
allow_rules = [
  "gh pr view *",
  "az devops project list *",
  "head *",
]

# Optional. The default is no initialization file.
# initialization_file = "/absolute/path/to/init.bash"

# Optional. The default is the server process's working directory.
# working_directory = "/absolute/path/to/working-directory"

max_runtime_ms = 60000
max_output_bytes = 1048576
max_concurrent = 4
